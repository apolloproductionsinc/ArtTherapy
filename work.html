<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>work — Art Supply</title>
  <meta name="description" content="Selected work: commercial, documentary, live, experiential and music.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Inter:wght@300;400;500&display=swap">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://i.vimeocdn.com">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body data-page="work">
  <a class="skip-link" href="#main">skip to content</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="index.html">Art Supply</a>
      <nav class="site-nav" aria-label="Primary">
        <ul>
          <li><a class="ul-link" href="work.html" aria-current="page">work</a></li>
          <li><a class="ul-link" href="about.html">about</a></li>
          <li><a class="ul-link" href="contact.html">contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <h1 class="visually-hidden">Work</h1>
    <!-- Full-bleed work. The index (filter + list) drops down from the toggle on the right. -->
    <section class="stage" data-stage aria-label="Work, one project at a time">
      <div class="stage__media"></div>
      <div class="stage__shade" aria-hidden="true"></div>
      <div class="stage__center"></div>
      <div class="stage__bar">
        <span class="stage__count" aria-hidden="true"></span>
        <div class="stage__caption">
          <h2 class="stage__title" aria-live="polite"></h2>
          <p class="stage__meta"></p>
        </div>
        <div class="stage__nav">
          <button class="stage__btn" type="button" data-stage-prev aria-label="Previous project">&larr; prev</button>
          <button class="stage__btn" type="button" data-stage-next aria-label="Next project">next &rarr;</button>
        </div>
      </div>
      <button class="stage__toggle" type="button" aria-expanded="false" aria-controls="stage-panel">
        <span>index</span><span class="stage__toggle-count"></span><span class="stage__chev" aria-hidden="true"></span>
      </button>
      <div class="stage__panel" id="stage-panel" role="region" aria-label="Project index and filter">
        <nav class="work-index__filters" id="work-filters" aria-label="Filter work by category"></nav>
        <ol class="work-index__list" id="work-index"></ol>
        <p class="stage__note">Selected work from the founders&rsquo; collective experience. Credits and roles to be confirmed.</p>
      </div>
      <noscript><p class="noscript-note" style="position:absolute;inset:auto 0 0;padding:24px;color:#fff">Turn on JavaScript to browse the work.</p></noscript>
    </section>
  </main>

  <footer class="site-footer">
    <span class="logo">Art Supply</span>
    <span>Los Angeles &middot; <span data-clock="America/Los_Angeles">pacific time</span></span>
    <a class="ul-link" href="contact.html">contact</a>
    <span class="site-footer__end">&copy; <span data-year>2026</span> &middot; work shown is selected founder experience</span>
  </footer>

  <script src="assets/js/work-data.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/work.js"></script>
</body>
</html>
